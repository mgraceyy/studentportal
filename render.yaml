services:
  - type: web
    name: student-portal-backend
    runtime: node
    buildCommand: npm install
    startCommand: node backend/src/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: BCRYPT_SALT_ROUNDS
        value: "10"
      - key: DB_HOST
        fromDatabase:
          name: student-portal-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: student-portal-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: student-portal-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: student-portal-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: student-portal-db
          property: password
      - key: FRONTEND_URL
        value: # Set this to your Vercel admin panel URL after deployment

  - type: postgres
    name: student-portal-db
    plan: free
    ipAllowList: []
