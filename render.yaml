services:
  - type: web
    name: student-portal-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install && npm run migrate && npm run seed
    startCommand: node src/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: BCRYPT_SALT_ROUNDS
        value: "10"
      - key: DATABASE_URL
        sync: false  # Set this to your Render Internal Database URL
      - key: FRONTEND_URL
        sync: false  # Set this to your Vercel admin panel URL after deployment
